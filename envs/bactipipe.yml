name: bactipipe
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11.13
  - pip
  # CheckM 1.2.4 still imports pkg_resources, removed in setuptools 81.
  - setuptools<81

  - awscli=1.42.6
  - boto3=1.40.6
  - biopython=1.85
  - checkm-genome=1.2.4
  - coreutils=9.5
  - fastp=1.0.1
  - filtlong=0.2.1
  - flye=2.9.6
  - kmerfinder=3.0.2
  - matplotlib=3.10.5
  - nanoplot=1.46.1
  - numpy=2.3.3
  - pandas=2.3.2
  - pillow=11.3.0
  - pplacer=1.1.alpha19
  - prodigal=2.6.3
  - pysam=0.23.3
  - seqkit=2.10.0
  - ska2=0.4.1
  - skani=0.3.0
  - skesa=2.5.1
  - spades=4.2.0
  - unicycler=0.5.1

  - colorama=0.4.6
  - hmmer=3.4
  - tabulate=0.10.0

  - pip:
      - cgecore==2.0.1
      - ete3==3.1.3
      - openpyxl==3.1.5
      - psutil==7.0.0
      - pyfastx==2.2.0
      - reportlab==4.4.4
      - textwrap3==0.9.2
      - tqdm==4.67.1
